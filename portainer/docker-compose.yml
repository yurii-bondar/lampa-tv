services:
  portainer:
    image: portainer/portainer-ce:lts
    container_name: portainer
    restart: unless-stopped
    command: --admin-password-file /run/secrets/admin-password
    # Localhost only. Access via SSH tunnel:
    #   ssh -N -L 9443:127.0.0.1:9443 user@<server>  ->  https://localhost:9443
    ports:
      - "127.0.0.1:9443:9443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer_data:/data
      - ./admin-password.txt:/run/secrets/admin-password:ro

volumes:
  portainer_data:
